<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Offline - Signature Mobile Detailing</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #000;
        color: #f8f8f8;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
        text-align: center;
      }
      .mark {
        font-weight: 800;
        letter-spacing: 0.06em;
        font-size: 28px;
        color: #d4a24c;
        margin-bottom: 12px;
      }
      h1 {
        font-weight: 600;
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: #c8c8c8;
        max-width: 32ch;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      button {
        background: #d4a24c;
        color: #0a0a0a;
        border: 0;
        border-radius: 999px;
        padding: 12px 22px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">SIGNATURE</div>
      <h1>You&rsquo;re offline</h1>
      <p>We can&rsquo;t reach the network right now. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
      <p style="margin:24px 0 8px;font-size:18px;line-height:1.6">
      You can still reach us by phone.
    </p>
    <p style="margin:0;font-size:20px;line-height:2">
      <a href="tel:+14807933782" style="color:#f6d379;font-weight:700;text-decoration:underline">Alex (480)&nbsp;793-3782</a>
      <br />
      <a href="tel:+16028815602" style="color:#f6d379;font-weight:700;text-decoration:underline">Kane (602)&nbsp;881-5602</a>
    </p>
</body>
</html>
